<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not found — Mimir Widgets</title>
  <!--
    Deliberately self-contained: no stylesheet link, no script, no font. This
    page's whole job is to be what a *missing asset* resolves to, so anything
    it referenced could be missing too. Cloudflare Pages serves index.html
    with a 200 for unmatched paths when no 404.html exists, which is how a
    stale /assets/style-<hash>.css came back as HTML — and, under
    X-Content-Type-Options: nosniff, was refused as a stylesheet, leaving
    every widget silently unstyled instead of loudly broken.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #1b1b1b;
      background: #fdfdfe;
    }
    main { max-width: 26rem; padding: 2rem 1.25rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    p { margin: 0 0 0.75rem; color: #5d5d5f; font-size: 0.9rem; }
    a { color: #006fdc; }
    @media (prefers-color-scheme: dark) {
      body { color: #dcdcde; background: #1a1a1c; }
      p { color: #98989d; }
      a { color: #409cff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Not found</h1>
    <p>
      There's no page or asset at this URL. If you reached this from an
      embedded widget, the embed is probably holding a cached page from
      before a deploy and asking for a hashed asset that no longer exists —
      reload it, or clear the client's cache.
    </p>
    <p><a href="/">All widgets</a></p>
  </main>
</body>
</html>
