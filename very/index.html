<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Very Dictionary — Mimir Widgets</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="very-content">
    <div class="very-field">
      <span class="very-prefix" aria-hidden="true">very</span>
      <input
        id="very-input"
        class="very-input"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        enterkeyhint="search"
        placeholder="tired"
        aria-label="An adjective you keep putting ‘very’ in front of"
      />
      <button
        id="very-shuffle"
        class="very-shuffle"
        type="button"
        title="Another word"
        aria-label="Show another word"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path
            d="M3 6h3.2l7.6 8H17M3 14h3.2l2.3-2.4M11.5 8.4L13.8 6H17"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15 3.6L17.6 6 15 8.4M15 11.6L17.6 14 15 16.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
    <div class="very-results" id="very-results" role="region" aria-live="polite"></div>
    <p class="very-foot" id="very-foot"></p>
  </div>
  <script type="module" src="/src/very.ts"></script>
</body>
</html>
